# nginx site for https://witbox.avitwil.io  (static files in /var/www/witbox)
# 1. copy the contents of site/ (without build.py and deploy/) to /var/www/witbox
# 2. put this file in /etc/nginx/sites-available/witbox and link it into sites-enabled
# 3. certbot --nginx -d witbox.avitwil.io
server {
    listen 80;
    listen [::]:80;
    server_name witbox.avitwil.io;
    root /var/www/witbox;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

    location / { try_files $uri $uri/ $uri.html =404; }
    location ~* \.(webp|jpg|png|css|js|svg|ico)$ { expires 7d; add_header Cache-Control "public"; }
    gzip on; gzip_types text/css application/javascript image/svg+xml;
}
